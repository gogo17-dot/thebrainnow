<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Brain Anatomy</title>
    <link rel="stylesheet" href="style.css?v=40" />
    <script>
      window.addEventListener('error', function (event) {
        window.__startupError = event.message || 'Unknown startup error';
        document.addEventListener('DOMContentLoaded', function () {
          var banner = document.getElementById('loading-banner');
          if (banner) {
            banner.hidden = false;
            banner.textContent = 'Startup error: ' + window.__startupError;
          }
        });
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        window.__startupError = reason && (reason.stack || reason.message) || String(reason);
        var banner = document.getElementById('loading-banner');
        if (banner) {
          banner.hidden = false;
          banner.textContent = 'Startup error: ' + window.__startupError;
        }
      });
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app" class="page page--viewer">
      <header class="viewer-bar">
        <h1 class="viewer-bar__title">Interactive Brain Anatomy</h1>
        <div class="viewer-bar__actions">
          <button id="reset-view" class="bar-btn" type="button">Reset view</button>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            role="switch"
            aria-label="Toggle day/night mode"
            aria-checked="false"
          >
            <span class="theme-toggle__track">
              <span class="theme-toggle__thumb" aria-hidden="true"></span>
              <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">☾</span>
              <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀</span>
            </span>
          </button>
        </div>
      </header>

      <canvas id="scene"></canvas>

      <aside class="structure-browser" id="structure-browser" aria-label="Structure browser">
        <div class="structure-browser__head">
          <h2 class="structure-browser__title">Structures</h2>
          <label class="structure-browser__search">
            <span class="visually-hidden">Search structures</span>
            <input
              id="structure-search"
              type="search"
              placeholder="Search…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>
        <div class="structure-browser__list" id="structure-list"></div>
      </aside>

      <aside class="info-panel" id="info-panel" hidden aria-live="polite">
        <button class="info-panel__close" id="info-close" type="button" aria-label="Close">×</button>
        <p class="info-panel__category" id="info-category"></p>
        <h2 class="info-panel__title" id="info-title"></h2>
        <p class="info-panel__overview" id="info-overview"></p>
        <button
          class="info-panel__more"
          id="info-more"
          type="button"
          aria-expanded="false"
          hidden
        >
          Clinical detail
        </button>
        <div class="info-panel__detail-wrap" id="info-detail-wrap" hidden>
          <p class="info-panel__detail" id="info-detail"></p>
        </div>
        <h3 class="info-panel__related-heading" id="info-related-heading" hidden>Related</h3>
        <div class="info-panel__related" id="info-related"></div>
      </aside>

      <div class="viewer-dock" id="viewer-dock">
        <div class="layer-toggles" id="layer-toggles" role="group" aria-label="Layer visibility"></div>
        <div class="explode-control" id="explode-control">
          <label class="explode-control__label" for="explode-slider">
            Isolate
            <span class="explode-control__value" id="explode-value">0%</span>
          </label>
          <input
            id="explode-slider"
            class="explode-control__slider"
            type="range"
            min="0"
            max="100"
            value="0"
            step="1"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          />
        </div>
      </div>

      <div class="structure-label" id="structure-label" hidden></div>

      <div class="viewer-tip" id="viewer-tip" hidden>
        <p class="viewer-tip__text">
          Drag to rotate · Scroll to zoom · Click a structure or use the list · Isolate to pull layers apart
        </p>
        <button class="viewer-tip__dismiss" id="tip-dismiss" type="button">Got it</button>
      </div>

      <p class="loading-banner" id="loading-banner">Loading anatomical models…</p>

      <footer class="copyright">© Omar Garagozov 2026</footer>
    </div>
    <script type="module" src="cerebralCortex.js?v=40"></script>
  </body>
</html>
